services:
  # 1. Edge Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: gidh-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - edge
    networks:
      - gidh-net

  # 2. Frontend Cockpit (Next.js 16 Standalone)
  frontend:
    image: gidh-intraday-frontend:latest
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}
    container_name: gidh-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - gidh-net

  # 3. Edge API and sole live-order execution owner
  edge:
    image: gidh-intraday-edge:latest
    build:
      context: ./edge
      dockerfile: Dockerfile
    container_name: gidh-edge
    restart: unless-stopped
    environment:
      - DB_HOST=gidh-timescaledb
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-gidh_intraday}
      - DB_SSLMODE=disable
      - REDIS_ADDR=gidh-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - KITE_API_KEY=${KITE_API_KEY:-}
      - KITE_API_SECRET=${KITE_API_SECRET:-}
      - KITE_ACCESS_TOKEN=${KITE_ACCESS_TOKEN:-}
      - KITE_USER_ID=${KITE_USER_ID:-}
      - KITE_PASSWORD=${KITE_PASSWORD:-}
      - KITE_TOTP_SECRET=${KITE_TOTP_SECRET:-}
      - FIREBASE_CREDENTIALS_B64=${FIREBASE_CREDENTIALS_B64:-}
      - ORDER_AUTHORIZED_EMAILS=${ORDER_AUTHORIZED_EMAILS:-kathuria.manuj@gmail.com,sylviachadha@gmail.com}
      - ORDER_LIVE_ENABLED=${ORDER_LIVE_ENABLED:-true}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://gidh.tech,https://www.gidh.tech}
      - PORT=8080
      - ENV=production
    volumes:
      - ./.env:/app/.env
    ports:
      - "8080:8080"
    networks:
      - gidh-net



  # 4. Backend Universe Market Data Streamer (210 stocks Kite WebSocket -> Redis + TimescaleDB)
  backend:
    image: gidh-intraday-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gidh-backend
    restart: unless-stopped
    environment:
      - DB_HOST=gidh-timescaledb
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-gidh_intraday}
      - DB_SSLMODE=disable
      - REDIS_ADDR=gidh-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - KITE_API_KEY=${KITE_API_KEY:-}
      - KITE_API_SECRET=${KITE_API_SECRET:-}
      - KITE_ACCESS_TOKEN=${KITE_ACCESS_TOKEN:-}
      - KITE_USER_ID=${KITE_USER_ID:-}
      - KITE_PASSWORD=${KITE_PASSWORD:-}
      - KITE_TOTP_SECRET=${KITE_TOTP_SECRET:-}
      - PORT=8081
      - ENV=production
    volumes:
      - ./.env:/app/.env
    networks:
      - gidh-net

networks:
  gidh-net:
    name: gidh-net
    external: true

