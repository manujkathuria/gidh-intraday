# ==============================================================================
# GIDH INTRADAY — UNIFIED GRAPHQL SCHEMA (SINGLE SOURCE OF TRUTH)
# ==============================================================================

"""
Core Market Instrument traded on NSE F&O
"""
type UniverseItem {
  symbol: String!
  name: String!
  cashToken: Int!
  cashTickSize: Float!
  futureToken: Int!
  futureTradingCode: String!
  futureExpiry: String!
  futureLotSize: Int!
  futureTickSize: Float!
}

"""
Historical Trading Session Date & Pipeline Run
"""
type Session {
  date: String!
  featureRunId: String!
  featureVersion: String!
  publishedAt: String!
}

"""
Macro Futures Institutional Inflow & Money Flow
"""
type FuturesInflowItem {
  symbol: String!
  tradingSymbol: String!
  sessionDate: String!
  futClose: Float!
  prevClose: Float!
  futOi: String!
  prevOi: String!
  totalNotionalCr: Float!
  price1dPct: Float!
  oi1dPct: Float!
  freshInflow1dCr: Float!
  oi3dPct: Float!
  freshInflow3dCr: Float!
}

"""
Macro Futures Response with Available Date Range
"""
type FuturesInflowResponse {
  sessionDate: String!
  availableDates: [String!]!
  totalCount: Int!
  data: [FuturesInflowItem!]!
}

"""
Historical / Live Intraday Candle
"""
type Candle {
  time: Int!
  open: Float!
  high: Float!
  low: Float!
  close: Float!
  volume: Float!
  vwap: Float!
  vwapUpper1: Float
  vwapLower1: Float
  vwapUpper2: Float
  vwapLower2: Float
  rvol: Float
}

"""
Replay Market Weather & Breadth
"""
type ReplayWeather {
  totalCivs: Int!
  aboveVwap: Int!
  belowVwap: Int!
  pctAboveVwap: Float!
}

"""
Replay Stock Snapshot
"""
type ReplayStock {
  symbol: String!
  sector: String!
  price: Float!
  gapPct: Float!
  movePct: Float!
  vwap: Float!
  vwapDistPct: Float!
  rvol: Float!
  clv: Float!
  volume: Float!
  isAboveVwap: Boolean!
}

"""
Replay Sector Aggregation
"""
type ReplaySector {
  sector: String!
  civCount: Int!
  avgMovePct: Float!
  avgRvol: Float!
  pctAboveVwap: Float!
}

"""
Replay Trap Detection
"""
type ReplayTrap {
  symbol: String!
  sector: String!
  trapType: String!
  confidence: String!
  description: String!
  movePct: Float!
  gapPct: Float!
  rvol: Float!
  clv: Float!
}

"""
Full Second-by-Second Replay Snapshot
"""
type ReplaySnapshot {
  sessionDate: String!
  asOfTime: String!
  weather: ReplayWeather!
  stocks: [ReplayStock!]!
  sectors: [ReplaySector!]!
  traps: [ReplayTrap!]!
}

"""
Active Trading Position & Order Lifecycle
"""
type ActivePosition {
  symbol: String!
  instrumentToken: Int!
  exchange: String!
  side: String!
  quantity: Int!
  entryPrice: Float!
  currentLtp: Float!
  pnlInr: Float!
  pnlPct: Float!
  mfePct: Float!
  stopFloorPct: Float!
  stopLossPrice: Float
  targetPrice: Float
  tactic: String
  invalidation: String
  brokerOrderId: String
  openedAt: String!
  updatedAt: String!
}

enum TradeSide {
  LONG
  SHORT
}

enum ManagedOrderType {
  MARKET
  SYNTHETIC_LIMIT
}

enum ManagedOrderStatus {
  PENDING
  TRIGGERING
  SUBMITTING
  SUBMITTED
  FILLED
  REJECTED
  CANCELLED
  RECONCILE_REQUIRED
  EXIT_SUBMITTED
  CLOSED
}

type ManagedOrder {
  id: ID!
  clientOrderId: ID!
  brokerOrderId: String
  orderType: ManagedOrderType!
  status: ManagedOrderStatus!
  symbol: String!
  instrumentToken: Int!
  exchange: String!
  side: TradeSide!
  quantity: Int!
  marginInr: Float!
  limitPrice: Float
  expectedStopPrice: Float
  expectedTargetPrice: Float
  actualFillPrice: Float
  stopPrice: Float
  targetPrice: Float
  rejectionReason: String
  createdAt: String!
  updatedAt: String!
}

input PlaceMarketOrderInput {
  clientOrderId: ID!
  symbol: String!
  side: TradeSide!
  marginInr: Float!
  tactic: String
  invalidation: String!
}

input PlaceLimitOrderInput {
  clientOrderId: ID!
  symbol: String!
  side: TradeSide!
  limitPrice: Float!
  marginInr: Float!
  tactic: String
  invalidation: String!
}

"""
Real-time Live Market Tick
"""
type MarketTick {
  symbol: String!
  token: Int!
  ltp: Float!
  changePct: Float!
  volume: Int!
  open: Float!
  high: Float!
  low: Float!
  close: Float!
  timestamp: String!
}

"""
Quant Brain Rule Configuration
"""
type BrainRuleItem {
  id: ID!
  category: String!
  name: String!
  confidence: Float!
  triggerTime: String
  conditions: [String!]!
  action: String!
  invalidation: String
  notes: String
}

"""
Quant Operating Schedule Checkpoint
"""
type OperatingScheduleItem {
  id: Int!
  time: String!
  timeWindow: String!
  sequenceOrder: Int!
  title: String!
  triggerEvent: String!
  desc: String!
  riskConstraint: String!
  status: String!
}

"""
Live Market Stream & Redis Heartbeat Status
"""
type MarketStatus {
  isLive: Boolean!
  liveDate: String
  lastTickAgeMs: Int
}

# ==============================================================================
# ROOT QUERIES & SUBSCRIPTIONS
# ==============================================================================

type Query {
  # Health check
  health: String!

  # Live Engine Status from Redis Heartbeat
  marketStatus: MarketStatus!

  # Market Core
  universe: [UniverseItem!]!
  sessions: [Session!]!
  
  # Macro Futures Money Flow
  futuresInflow(date: String, minPrice: Float, maxPrice: Float, minInflow: Float, minOiPct: Float): FuturesInflowResponse!

  # Market Snapshot & Multi-Interval Candles
  marketSnapshot(date: String): ReplaySnapshot!
  candles(symbol: String!, date: String!, interval: String): [Candle!]!
  sectors(date: String): [ReplaySector!]!

  # Backward compatible aliases
  replaySnapshot(sessionDate: String!, time: String): ReplaySnapshot!
  replayCandles(sessionDate: String!, symbol: String!, toTime: String, interval: String): [Candle!]!

  # Quant Strategy Metadata
  brainRules: [BrainRuleItem!]!
  operatingSchedule: [OperatingScheduleItem!]!

  # Live Positions
  livePositions: [ActivePosition!]!
  managedOrders: [ManagedOrder!]!
}

type Mutation {
  placeMarketOrder(input: PlaceMarketOrderInput!): ManagedOrder!
  placeLimitOrder(input: PlaceLimitOrderInput!): ManagedOrder!
  cancelLimitOrder(id: ID!): ManagedOrder!
  squareOffPosition(symbol: String!, reason: String!): ManagedOrder!
}

type Subscription {
  # Real-time WebSocket Market Tick Stream
  marketTicks(symbols: [String!]): MarketTick!

  # Real-time WebSocket 1m/5m Live Candle Stream
  candleStream(symbol: String!, interval: String): Candle!

  # Real-time Broker Order & Position Updates
  liveOrderUpdates: ActivePosition!
}
