upstream nextjs_upstream {
    server gidh-frontend:3000;
    keepalive 32;
}

upstream edge_upstream {
    server gidh-edge:8080;
    keepalive 32;
}

# 1. HTTP to HTTPS Redirect & ACME Challenge
server {
    listen 80;
    server_name gidh.tech www.gidh.tech localhost;

    client_max_body_size 10M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Secure Reverse Proxy
server {
    listen 443 ssl;
    http2 on;
    server_name gidh.tech www.gidh.tech localhost;

    client_max_body_size 10M;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/gidh.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gidh.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Go Edge API Routes (/v1/, /graphql, and /healthz)
    location /v1/ {
        proxy_pass http://edge_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /healthz {
        proxy_pass http://edge_upstream;
        proxy_http_version 1.1;
    }

    # Real-Time WebSocket Routes (/v1/replay/ws and /v1/live/orders/ws)
    location ~* ^/v1/.*/ws$ {
        proxy_pass http://edge_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location = /graphql {
        proxy_pass http://edge_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Next.js Static Assets
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # Next.js Web Cockpit UI (All other routes)
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
